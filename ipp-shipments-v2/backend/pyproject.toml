[project]
name = "ipp-shipments-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic-settings==2.6.1",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "supabase==2.10.0",
    "anthropic==0.40.0",
    "openpyxl==3.1.5",
    "pillow==11.0.0",
    "python-multipart==0.0.17",
    "httpx==0.28.0",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"
